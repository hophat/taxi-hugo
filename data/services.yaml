# Cấu hình dịch vụ taxi
services:
  - name: "Taxi Trong Thành Phố"
    description: "Phục vụ di chuyển trong nội thành Vinh với giá cả hợp lý, tài xế thân thiện và xe sạch sẽ."
    price: "15,000đ/km"
    icon: "🚕"

  - name: "Taxi Liên Tỉnh"
    description: "Đưa đón sân bay Vinh, di chuyển đến Hà Tĩnh, Quảng Bình với mức giá cạnh tranh."
    price: "Từ 120,000đ"
    icon: "🚗"

  - name: "Phục Vụ 24/7"
    description: "Hoạt động 24 giờ trong ngày, 7 ngày trong tuần. Sẵn sàng phục vụ bạn bất cứ lúc nào."
    price: "Luôn sẵn sàng"
    icon: "🕐"

