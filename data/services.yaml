# Cấu hình dịch vụ taxi
services:
  - name: "Taxi Trong Thành Phố"
    description: "Phục vụ di chuyển trong nội thành Tuyên Quang với giá cả hợp lý, tài xế thân thiện và xe sạch sẽ."
    price: "18,000đ/km"
    icon: "🚕"

  - name: "Taxi Liên Tỉnh"
    description: "Đưa đón sân bay Nội Bài, di chuyển đến Hà Nội, Thái Nguyên với mức giá cạnh tranh."
    price: "Từ 200,000đ"
    icon: "🚗"

  - name: "Phục Vụ 24/7"
    description: "Hoạt động 24 giờ trong ngày, 7 ngày trong tuần. Sẵn sàng phục vụ bạn bất cứ lúc nào."
    price: "Luôn sẵn sàng"
    icon: "🕐"

