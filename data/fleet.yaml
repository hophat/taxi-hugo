# Cấu hình đội xe taxi
vehicles:
  - type: "4_seats"
    name: "Xe 4 Chỗ"
    models: "Toyota Vios, Hyundai Accent"
    description: "Phù hợp cho gia đình nhỏ, tiết kiệm nhiên liệu."
    price: "15,000đ/km"
    image: "/xe1.jpg"
    capacity: "1-4 người"
