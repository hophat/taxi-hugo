      - "Tiết kiệm nhiên liệu"
      - "Phù hợp gia đình nhỏ"
      - "Giá cả hợp lý"

  - type: "7_seats"
    name: "Xe 7 Chỗ"
    models: "Toyota Innova, Mitsubishi Xpander"
    description: "Phù hợp cho nhóm đông người, hành lý rộng rãi."
    price: "18,000đ/km"
    image: "/xe2.jpg"
    capacity: "5-7 người"
    features:
      - "Rộng rãi thoải mái"
      - "Phù hợp nhóm đông"
      - "Hành lý nhiều"

  - type: "16_seats"
    name: "Xe 16 Chỗ"
    models: "Ford Transit, Hyundai Solati"
    description: "Phù hợp cho đoàn du lịch, thoải mái cho chuyến dài."
    price: "Thỏa thuận"
    image: "/xe3.jpg"
    capacity: "8-16 người"
    features:
      - "Đoàn du lịch"
      - "Chuyến đi dài"
      - "Thoải mái nhất"

