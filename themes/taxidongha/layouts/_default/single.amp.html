{{ define "main" }}
<div class="container">
  <article class="card">
    <header class="article-header">
      <h1 class="article-title">{{ .Title }}</h1>
      <div class="news-meta" style="justify-content: center;">
        <time>{{ .Date.Format "02/01/2006" }}</time>
        <span class="news-category">{{ .Section | title }}</span>
      </div>
    </header>

    <div class="article-content">
      {{ .Content }}
    </div>

    <footer style="border-top: 1px solid #e1e5e9; padding-top: 2rem; margin-top: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <a href="{{ .Section }}/amp/" class="btn btn-outline">← Quay Lại</a>
        <a href="tel:{{ site.Params.phone }}" class="btn">Gọi Taxi Ngay</a>
      </div>
    </footer>
  </article>

  <!-- Contact CTA -->
  <section class="card" style="margin-top: 2rem; text-align: center; background: linear-gradient(135deg, #27ae60, #2ecc71);">
    <h3 style="color: white; margin-bottom: 1rem;">Cần Đặt Xe Taxi?</h3>
    <p style="color: white; margin-bottom: 2rem; opacity: 0.9;">
      Liên hệ ngay với Taxi Bắc Ninh để được phục vụ tốt nhất
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="tel:{{ site.Params.phone }}" class="btn" style="background: white; color: #27ae60;">
        📞 Gọi Ngay: {{ site.Params.phone }}
      </a>
      <a href="/amp/" class="btn btn-outline" style="border-color: white; color: white;">
        🏠 Về Trang Chủ
      </a>
    </div>
  </section>
</div>
{{ end }}
